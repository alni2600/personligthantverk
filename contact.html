<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Kontakta oss</title>
    <script src="js/main.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- strukturerar hela sidan (header/main/footer) -->
    <div id="page-container">
        <!-- Header -->
        <header>
            <!-- logotypen -->
            <a href="index.html"><img src="images/logo.svg" alt="Personligt hantverk logotyp" id="logotyp"></a>

            <!-- nav-lista som döljs i mobilvy -->
            <nav>
                <ul id="nav-ul">
                    <li class="nav-list"><a href="index.html">Startsida</a></li>
                    <li class="nav-list"><a href="services.html">Våra tjänster</a></li>
                    <li class="nav-list"><a href="about-us.html">Om oss</a></li>
                    <li class="nav-list"><a href="contact.html">Kontakta oss</a></li>
                </ul>
            </nav>
            <!-- hamburgermenyn -->
            <a id="burger-menu"><img src="images/icons8-menu.svg" alt="meny-ikon"></a>

        </header>

        <!-- Main -->
        <main>
            <img src="images/apartment.jpg" alt="byt ut" id="hero">
            
            <h1>Kontakta oss</h1>

            <p>Vill du ha kontakt med oss? Ring oss på 0701234567 eller fyll i kontaktformuläret.</p>
            <p>Det går också bra att skicka ett mejl till <a href="mailto:exempel@exempel.com">exempel@exempel.com</a></p>

            <form id="submit">
                <label for="name">Ditt namn</label>
                <input type="text" id="name" autocomplete="on" placeholder="Skriv ditt namn här">
                <label for="email">Epost</label>
                <input type="email" id="email" autocomplete="on" placeholder="exempel@exempel.com">
                <label for="phone">Telefonnummer</label>
                <input type="number" id="phone" autocomplete="on" placeholder="0701234567">
                <label for="message">Skriv ditt meddelande här</label>
                <input type="text" id="message" autocomplete="off" placeholder="Hej! Jag vill veta...">
                <input type="submit" id="submitButton">

            </form>

        </main>

        <!-- Footer -->
         <footer>
            <p>Personligt Hantverk</p>
            <p>(Telefonnummer)</p>
         </footer>

    </div>
</body>
</html>
